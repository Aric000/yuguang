name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Test core
        run: bash scripts/test.sh
      - name: Build application
        run: bash scripts/build-app.sh
      - name: Verify bundle
        run: |
          codesign --verify --deep --strict dist/余光.app
          plutil -lint dist/余光.app/Contents/Info.plist
      - uses: actions/upload-artifact@v7
        with:
          name: Yuguang-macOS
          path: dist/Yuguang-macOS.zip
          if-no-files-found: error
          retention-days: 14
