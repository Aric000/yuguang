name: Release native clients
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-dotnet@v5
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - name: Test and package Mac
        if: runner.os == 'macOS'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          bash scripts/test-macos.sh
          bash scripts/build-macos.sh "${RELEASE_TAG#v}"
          apps/macos/dist/余光.app/Contents/MacOS/Yuguang --check-forum-model
          apps/macos/dist/余光.app/Contents/MacOS/Yuguang --demo --self-test
      - name: Test and package Windows
        if: runner.os == 'Windows'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          ./scripts/test-windows.ps1
          ./scripts/build-windows.ps1 -Version ($env:RELEASE_TAG -replace '^v','')
          ./scripts/check-package-windows.ps1 -Version ($env:RELEASE_TAG -replace '^v','')
      - name: Upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          assets=(release/*.dmg release/*.zip release/*.exe release/*.sha256)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
