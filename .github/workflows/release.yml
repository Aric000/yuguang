name: Release desktop

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            arch: arm64
          - os: windows-latest
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Match application version to Release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-version.cjs
      - run: npm test
      - run: npm run desktop-check
      - name: Build installers
        run: npm run dist -- --${{ matrix.target }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create checksums
        run: node scripts/checksums.cjs
      - name: Upload installers to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          assets=(release/*.dmg release/*.zip release/*.exe release/*.sha256)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
